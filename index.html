<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="複数ECの価格と過去相場から、本当に安い商品を見つけるアプリ" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Deal Hunter AI</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">DEAL HUNTER AI</p>
        <h1>今日の掘り出し物</h1>
      </div>
      <span class="version">v0.1.0</span>
    </header>

    <main>
      <section class="hero-card">
        <div>
          <p class="hero-label">本日の監視結果</p>
          <strong><span id="dealCount">18</span>件の有力ディール</strong>
          <p>他サイト相場と過去価格の両方から判定</p>
        </div>
        <div class="radar">◎</div>
      </section>

      <section class="toolbar" aria-label="絞り込み">
        <button class="chip active" data-filter="all">すべて</button>
        <button class="chip" data-filter="家電">家電</button>
        <button class="chip" data-filter="ゲーム">ゲーム</button>
        <button class="chip" data-filter="ホビー">ホビー</button>
      </section>

      <section class="section-heading">
        <div>
          <p class="eyebrow">BEST DEALS</p>
          <h2>お得度ランキング</h2>
        </div>
        <select id="sortSelect" aria-label="並び替え">
          <option value="score">AIスコア順</option>
          <option value="discount">値引率順</option>
          <option value="price">価格の安い順</option>
        </select>
      </section>

      <section id="dealList" class="deal-list" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item active" data-view="home"><span>⌂</span>ホーム</button>
      <button class="nav-item" data-view="ranking"><span>↗</span>ランキング</button>
      <button class="nav-item" data-view="search"><span>⌕</span>検索</button>
      <button class="nav-item" data-view="favorite"><span>♡</span>お気に入り</button>
    </nav>
  </div>

  <dialog id="detailDialog">
    <button class="dialog-close" aria-label="閉じる">×</button>
    <div id="detailContent"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
