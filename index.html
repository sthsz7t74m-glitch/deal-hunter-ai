<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="複数ECの価格と過去相場から、本当に安い商品を見つけるアプリ" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=3" />
  <link rel="stylesheet" href="provider.css?v=2" />
  <title>Deal Hunter AI</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">DEAL HUNTER AI</p>
        <h1>今日の掘り出し物</h1>
      </div>
      <span class="version">v0.4.0</span>
    </header>

    <main>
      <section class="hero-card">
        <div>
          <p class="hero-label">相場＋過去価格の判定結果</p>
          <strong><span id="dealCount">0</span>件の有力ディール</strong>
          <p>楽天市場の公式APIフィードと複数ショップ価格を統合して自動判定</p>
        </div>
        <div class="radar">◎</div>
      </section>

      <section class="provider-panel" aria-label="価格データソース">
        <div class="provider-heading">
          <div>
            <p class="eyebrow">DATA PROVIDERS</p>
            <strong id="providerSummary">データソースを準備中</strong>
          </div>
          <button id="providerReload" class="provider-reload" type="button">再読込</button>
        </div>
        <div id="providerStatuses" class="provider-statuses"></div>
      </section>

      <section class="toolbar" aria-label="絞り込み">
        <button class="chip active" data-filter="all">すべて</button>
        <button class="chip" data-filter="家電">家電</button>
        <button class="chip" data-filter="ゲーム">ゲーム</button>
        <button class="chip" data-filter="ホビー">ホビー</button>
      </section>

      <section class="section-heading">
        <div>
          <p class="eyebrow">BEST DEALS</p>
          <h2>お得度ランキング</h2>
        </div>
        <select id="sortSelect" aria-label="並び替え">
          <option value="score">総合スコア順</option>
          <option value="discount">相場差が大きい順</option>
          <option value="price">価格の安い順</option>
        </select>
      </section>

      <section id="dealList" class="deal-list" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item active" data-view="home"><span>⌂</span>ホーム</button>
      <button class="nav-item" data-view="ranking"><span>↗</span>ランキング</button>
      <button class="nav-item" data-view="search"><span>⌕</span>検索</button>
      <button class="nav-item" data-view="favorite"><span>♡</span>お気に入り</button>
    </nav>
  </div>

  <dialog id="detailDialog">
    <button class="dialog-close" aria-label="閉じる">×</button>
    <div id="detailContent"></div>
  </dialog>

  <script src="deal-engine.js?v=1"></script>
  <script src="providers/provider-core.js?v=2"></script>
  <script src="providers/sample-providers.js?v=2"></script>
  <script src="providers/rakuten-provider.js?v=1"></script>
  <script src="deal-catalog.js?v=3"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
