name: Update Rakuten deal data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-rakuten-data.yml'
      - 'scripts/update-rakuten-data.mjs'
      - 'data/watchlist.json'

permissions:
  contents: write

concurrency:
  group: publish-rakuten-deal-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check API credentials
        id: credentials
        shell: bash
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          if [ -n "$RAKUTEN_APPLICATION_ID" ] && [ -n "$RAKUTEN_ACCESS_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Rakuten API credentials are not configured. Add RAKUTEN_APPLICATION_ID and RAKUTEN_ACCESS_KEY repository secrets.'
          fi

      - name: Read previous published feed
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          git fetch origin deal-data:refs/remotes/origin/deal-data || true
          git show origin/deal-data:rakuten-offers.json > /tmp/rakuten-existing.json 2>/dev/null || true

      - name: Generate Rakuten feed
        if: steps.credentials.outputs.configured == 'true'
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_EXISTING_FILE: /tmp/rakuten-existing.json
          RAKUTEN_OUTPUT: /tmp/rakuten-offers.json
        run: node scripts/update-rakuten-data.mjs

      - name: Publish feed to data branch
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan deal-data-publish
          git rm -rf .
          cp /tmp/rakuten-offers.json rakuten-offers.json
          cat > README.md <<'EOF'
          # Deal Hunter generated data

          This branch is generated by GitHub Actions. Do not edit it manually.
          EOF
          git add rakuten-offers.json README.md
          git commit -m 'data: update Rakuten offers'
          git push --force origin HEAD:deal-data
